## Reverse proxy for the ParkQueen Next.js app (PM2, port 3000).
## Copy the contents of this `server` block into your real Nginx site file,
## e.g. /etc/nginx/sites-available/parkqueenhotels.com — this repo file is
## a reference, Nginx does not read it from here.

upstream parkqueen_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name parkqueenhotels.com www.parkqueenhotels.com;

    # Redirect to HTTPS once TLS is issued (certbot etc.) — remove if TLS is
    # terminated elsewhere.
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    location / {
        proxy_pass http://parkqueen_upstream;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The image optimizer fetches the original from Cloudinary and
        # re-encodes it before responding — this is slower than a normal
        # page request, so give it real headroom instead of the 60s Nginx
        # default. If the upstream is actually crashing (see sharp fix),
        # these timeouts don't mask that — a dead process still 502s
        # immediately, they only prevent false-positive 504s once the
        # process is healthy.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Next.js streams image responses; don't let Nginx buffer the whole
        # thing into a temp file before forwarding.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;

        proxy_next_upstream error timeout invalid_header;
    }

    location /_next/static/ {
        proxy_pass http://parkqueen_upstream;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
